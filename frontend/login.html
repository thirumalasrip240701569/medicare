<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login | MediCare</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header" data-nav></header><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">Welcome back</div><h1>Sign in to MediCare</h1><p>Manage your hospital appointments and health information.</p><form class="auth-form" data-auth-form data-mode="login"><div class="message"></div><div class="form-group"><label for="role">Sign in as</label><select class="form-control" id="role" name="role" required><option value="patient">Patient</option><option value="doctor">Doctor</option><option value="receptionist">Receptionist</option><option value="admin">Admin</option></select></div><div class="form-group"><label for="email">Email address</label><input class="form-control" id="email" name="email" type="email" required autocomplete="email"></div><div class="form-group"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div><button class="btn btn-primary">Sign In</button></form><p class="auth-switch">New to MediCare? <a href="register.html">Create an account</a></p></section></main><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
