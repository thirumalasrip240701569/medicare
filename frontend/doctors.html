<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Find Doctors | MediCare</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header" data-nav></header><main><section class="page-hero"><div class="container"><div class="eyebrow">Our care team</div><h1>Find the right doctor</h1><p>Search experienced specialists at MediCare Central Hospital.</p></div></section><section class="section"><div class="container"><form class="filter-bar" data-doctor-search><input aria-label="Search doctors" placeholder="Search by doctor or specialty"><select aria-label="Filter by specialty"><option>All specialties</option><option>Cardiology</option><option>Neurology</option><option>Gynecology</option></select><select aria-label="Filter by availability"><option>Any availability</option><option>This week</option><option>Next week</option></select><button class="btn btn-primary">Search</button></form><div class="doctor-grid" data-doctors-grid><p class="empty-state">Loading doctors...</p></div></div></section></main><footer class="site-footer"><div class="container footer-bottom">© 2026 MediCare. In-person hospital appointments made simple.</div></footer><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const value=new URLSearchParams(location.search).get('search');const input=document.querySelector('[data-doctor-search] input');if(value){input.value=value;}});</script></body></html>
