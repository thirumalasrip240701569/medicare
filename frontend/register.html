<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account | MediCare</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header" data-nav></header><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">Start with MediCare</div><h1>Create your account</h1><p>Keep your hospital visits organized in one place.</p><form class="auth-form" data-auth-form data-mode="register"><div class="message"></div><div class="form-group"><label for="name">Full name</label><input class="form-control" id="name" name="name" required></div><div class="form-group"><label for="email">Email address</label><input class="form-control" id="email" name="email" type="email" required></div><div class="form-group"><label for="phone">Phone number</label><input class="form-control" id="phone" name="phone" type="tel" required></div><div class="form-group"><label for="password">Password</label><input class="form-control" id="password" name="password" type="password" minlength="8" required></div><div class="form-group"><label for="confirmPassword">Confirm password</label><input class="form-control" id="confirmPassword" name="confirmPassword" type="password" minlength="8" required></div><button class="btn btn-primary">Create Account</button></form><p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p></section></main><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
